name: MediaScope candidate evidence review

on:
  workflow_dispatch:
    inputs:
      local_receipt:
        description: Local test receipt for the verification tag
        type: string
        required: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  prepare:
    name: Prepare MediaScope candidate evidence
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73a66c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the candidate and both partitions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MEDIASCOPE_SPLIT_BASELINE: ${{ vars.MEDIASCOPE_SPLIT_BASELINE }}
          MEDIASCOPE_MAIN_RECOVERY: ${{ vars.MEDIASCOPE_MAIN_RECOVERY }}
          MEDIASCOPE_SPLIT_RECEIPT: ${{ inputs.local_receipt }}
          MEDIASCOPE_ACCEPTANCE_MODE: review
        run: node scripts/split-tests.mjs ci
      - name: Save candidate acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mediascope-ci-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/ci-scope.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
          overwrite: false

  review-local:
    name: Review MediaScope local evidence
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: mediascope-local-evidence
    steps:
      - name: Record completion of the protected review job
        run: echo 'Check the native review history before reusing this acceptance.'
