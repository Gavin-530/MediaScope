name: Commit message checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SPLIT_TAG: >-
        ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/verify-main-')
            && !startsWith(github.ref, 'refs/tags/verify-main-accepted-')
            && (vars.MEDIASCOPE_SPLIT_ENABLED == 'true' || startsWith(github.ref, 'refs/tags/verify-main-pilot-')) }}
      SPLIT_REUSE: ${{ vars.MEDIASCOPE_SPLIT_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/verify-main-accepted-') }}
    steps:
      - name: Check out history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the commit checker
        if: env.SPLIT_TAG != 'true' && env.SPLIT_REUSE != 'true' && (vars.MEDIASCOPE_SPLIT_ENABLED != 'true' || github.event_name != 'push' || github.ref != 'refs/heads/main')
        run: npm run test:commits
      - name: Run commit self-tests once and record their IDs
        id: split
        if: env.SPLIT_TAG == 'true'
        run: node scripts/split-tests.mjs commits
      - name: Check new commits and PR title
        run: node scripts/check-commits.mjs --event "$GITHUB_EVENT_PATH"
      - name: Save commit self-test receipt
        if: steps.split.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mediascope-split-commits-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/commit-proof.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
