name: Commit message checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the commit checker
        run: npm run test:commits
      - name: Check new commits and PR title
        run: node scripts/check-commits.mjs --event "$GITHUB_EVENT_PATH"
