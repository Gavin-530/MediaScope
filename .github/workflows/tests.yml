name: MediaScope tests

on:
  push:
    branches-ignore: [codex/verify-release-0.2.8]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediascope-tests-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  full-regression:
    name: Windows full regression
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare locked runtime and execute strict full regression
        id: regression
        timeout-minutes: 75
        run: ./scripts/run-ci-tests.ps1
      - name: Export independent results or interruption diagnostics
        id: evidence_export
        if: always()
        env:
          TEST_STEP_OUTCOME: ${{ steps.regression.outcome }}
        run: ./scripts/export-github-test-evidence.ps1 -TestStepOutcome $env:TEST_STEP_OUTCOME
      - name: Upload this run's compact evidence
        if: always() && steps.evidence_export.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mediascope-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-archive/pending/cloud-export/bundle.zip
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
          overwrite: false
